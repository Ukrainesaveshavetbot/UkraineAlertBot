services:
  - type: web
    name: ukraine-alert-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ALERTS_API_TOKEN
        sync: false
      - key: PUBLIC_MAP_URL
        sync: false
