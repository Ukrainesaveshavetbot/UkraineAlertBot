<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Статуси тривог</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#111827;color:#fff;font:16px Arial}header{padding:16px;background:#1f2937}#map{height:60vh;min-height:380px}#meta{font-size:13px;color:#cbd5e1}#list{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;padding:12px}.item{background:#1f2937;border-radius:8px;padding:10px}.small,footer{color:#cbd5e1;font-size:12px}footer{padding:12px;line-height:1.5}</style></head><body><header><b>Статуси повітряних тривог по областях</b><div id="meta">Завантаження…</div></header><div id="map"></div><section id="list"></section><footer>Показані лише регіональні статуси офіційних попереджень. Дані можуть затримуватися й не замінюють сирени, офіційні застосунки та вказівки служб. Карта не показує місце, напрямок або маршрут безпілотників.</footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const pts={"АР Крим":[45,34.1],"Волинська область":[50.75,25.33],"Вінницька область":[49.23,28.47],"Дніпропетровська область":[48.46,35.05],"Донецька область":[48,37.8],"Житомирська область":[50.25,28.66],"Закарпатська область":[48.62,22.3],"Запорізька область":[47.84,35.14],"Івано-Франківська область":[48.92,24.71],"м. Київ":[50.45,30.52],"Київська область":[50.1,30.2],"Кіровоградська область":[48.51,32.26],"Луганська область":[48.57,39.3],"Львівська область":[49.84,24.03],"Миколаївська область":[46.97,31.99],"Одеська область":[46.48,30.72],"Полтавська область":[49.59,34.55],"Рівненська область":[50.62,26.25],"м. Севастополь":[44.62,33.52],"Сумська область":[50.91,34.8],"Тернопільська область":[49.55,25.59],"Харківська область":[49.99,36.23],"Херсонська область":[46.64,32.62],"Хмельницька область":[49.42,26.99],"Черкаська область":[49.44,32.06],"Чернівецька область":[48.29,25.94],"Чернігівська область":[51.5,31.3]};
const colors={R:"#dc2626",A:"#dc2626",Y:"#eab308",P:"#f97316",N:"#16a34a"," ":"#64748b"};const map=L.map("map").setView([48.8,31.2],6);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);let marks=[];
async function update(){try{let d=await(await fetch("/api/status",{cache:"no-store"})).json(),a=d.statuses||[];document.getElementById("meta").textContent=d.error?"Дані тимчасово недоступні: "+d.error:"Оновлення автоматично приблизно раз на 90 секунд";document.getElementById("list").innerHTML=a.map(x=>`<div class="item"><b>${x.emoji} ${x.name}</b><div class="small">${x.label}</div></div>`).join("");marks.forEach(x=>map.removeLayer(x));marks=[];a.forEach(x=>{if(!pts[x.name])return;let m=L.circleMarker(pts[x.name],{radius:9,color:"#111",weight:2,fillColor:colors[x.code]||"#64748b",fillOpacity:.9}).addTo(map).bindPopup(`<b>${x.name}</b><br>${x.emoji} ${x.label}`);marks.push(m)})}catch(e){document.getElementById("meta").textContent="Не вдалося отримати дані"}}update();setInterval(update,30000);</script></body></html>
